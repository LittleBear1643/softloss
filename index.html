<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>softloss</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { touch-action: manipulation; }
  button { cursor: pointer; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    overflow: hidden;
    gap: 10px;
    font-family: sans-serif;
    font-size: 12px;
    padding: 10px;
    -webkit-text-size-adjust: 100%;
  }
  canvas { border: 3px solid #000000; display: block; max-width: 100%; }
  .controls {
    width: 250px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }
  .controls input[type="range"] { flex: 1; min-width: 0; }
  .controls span { min-width: 40px; text-align: right; font-weight: bold; }
  .controls input[type="number"] { width: 70px; padding: 3px; }
  .controls button { padding: 3px 8px; }
  .bet-row { gap: 4px; }
  .bet-row input[type="number"] { flex: 1; min-width: 0; width: auto; }
  .spin-row { width: 250px; margin-bottom: 16px; }
  .spin-row button { width: 100%; padding: 8px 0; font-size: 14px; }
  #result {
    width: 250px;
    min-height: 1.5em;
    text-align: center;
    font-weight: bold;
  }

  .outcome-row {
    width: 250px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .left-col {
    width: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .box-deposit {
    width: 110px;
    height: 162px;
    border-radius: 6px;
    outline: 1px solid #555;
    padding: 2px;
    background: #fff;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 2px;
    overflow: hidden;
  }

  .outcome-right {
    width: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .box-win, .box-return {
    width: 110px;
    height: 56px;
    padding: 2px;
    border-radius: 6px;
    background: #fff;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
  }
  .box-win { outline: 1px solid #00b300; }
  .box-return { outline: 1px solid #e00000; }

  .outcome-or {
    width: 110px;
    height: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
    font-weight: bold;
    color: #000;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .outcome-arrow {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 162px;
    font-size: 14px;
    font-weight: bold;
    line-height: 1;
    user-select: none;
  }

  .cube {
    width: 48px;
    height: 48px;
    margin: 2px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 12px;
    font-weight: bold;
    outline: 1px solid #555;
    background: #fff;
    overflow: hidden;
  }
  .cube-nft {
    object-fit: cover;
    cursor: pointer;
    outline: none;
  }
  .cube-gram {
    color: #000;
  }

  .btn-add-nft {
    font-size: 12px;
    width: 112px;
    padding: 2px 0;
  }

  .inventory-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 16px;
  }
  .inventory-overlay.open { display: flex; }
  .inventory-modal {
    background: #fff;
    width: 100%;
    max-width: 360px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .inventory-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid #eee;
    font-weight: bold;
    font-size: 14px;
  }
  .inventory-close {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
  }
  .inventory-list {
    padding: 10px;
    overflow-y: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .inventory-empty {
    padding: 24px;
    text-align: center;
    color: #777;
    width: 100%;
  }
  .inventory-item {
    width: 96px;
    border-radius: 8px;
    outline: 1px solid #ccc;
    padding: 4px;
    cursor: pointer;
    text-align: center;
  }
  .inventory-item img {
    width: 100%;
    border-radius: 6px;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
  }
  .inventory-item .inv-price {
    display: block;
    margin-top: 4px;
    font-size: 12px;
  }
</style>
</head>
<body>
<canvas id="canvas" width="250" height="250"></canvas>

<div class="spin-row">
  <button id="spin"><b>Вперёд!</b></button>
</div>

<div class="controls">
  <span>Баланс: <code id="balance"></code> GRAM</span>
</div>

<div class="controls bet-row">
  <button id="betMinus">−</button>
  <input type="number" id="bet" value="1" min="0.5" step="0.01">
  <button id="betPlus">+</button>
  <button id="betMax">МАКС</button>
</div>

<div class="controls">
  <label><input type="checkbox" id="fastMode"> Быстрый режим</label>
  <button id="reset">Заново</button>
</div>

<div class="controls">
  <label for="chance">Шанс:</label>
  <input type="range" id="chance" min="10" max="75" value="30" step="1">
  <span id="chanceValue">30%</span>
</div>

<div class="controls">
  <button class="chance-preset" data-chance="30">30%</button>
  <button class="chance-preset" data-chance="50">50%</button>
  <button class="chance-preset" data-chance="75">75%</button>
</div>

<div class="outcome-row">
  <div class="left-col">
    <div class="box-deposit" id="depositContainer">
    </div>
    <button id="addNftBtn" class="btn-add-nft">Добавить NFT</button>
  </div>

  <div class="outcome-arrow">→</div>

  <div class="outcome-right">
    <div class="box-win" id="winContainer"></div>
    
    <div class="outcome-or">либо</div>
    
    <div class="box-return" id="returnContainer">
      <div class="cube cube-gram" id="returnAmount">0.00</div>
    </div>
  </div>
</div>

<div id="result"></div>

<div class="inventory-overlay" id="inventoryOverlay">
  <div class="inventory-modal">
    <div class="inventory-header">
      <span>Инвентарь</span>
      <button class="inventory-close" id="inventoryClose">×</button>
    </div>
    <div class="inventory-list" id="inventoryList"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const slider = document.getElementById('chance');
const chanceValue = document.getElementById('chanceValue');
const betInput = document.getElementById('bet');
const spinBtn = document.getElementById('spin');
const resetBtn = document.getElementById('reset');
const fastModeEl = document.getElementById('fastMode');
const balanceEl = document.getElementById('balance');
const returnAmountEl = document.getElementById('returnAmount');
const resultEl = document.getElementById('result');
const presetBtns = document.querySelectorAll('.chance-preset');
const betMinusBtn = document.getElementById('betMinus');
const betPlusBtn = document.getElementById('betPlus');
const betMaxBtn = document.getElementById('betMax');
const addNftBtn = document.getElementById('addNftBtn');
const depositContainer = document.getElementById('depositContainer');
const winContainer = document.getElementById('winContainer');
const inventoryOverlay = document.getElementById('inventoryOverlay');
const inventoryClose = document.getElementById('inventoryClose');
const inventoryList = document.getElementById('inventoryList');

const FIELD_SIZE = 250;
const BALL_RADIUS = 6.25;
const MAX_SPEED = 25;
const FRICTION = 0.99;
const MIN_SPEED = 0.05;
const ACCEL_RATE = (1 - FRICTION) * 5;
const FAST_MULTIPLIER = 5;
const MARGIN = 0.05;
const INITIAL_BALANCE = 5;
const STORAGE_KEY = 'ricochet_balance';
const INVENTORY_KEY = 'ricochet_inventory';
const COLORS = { red: '#e00000', green: '#00b300' };
const BET_STEP = 0.1;

const ALL_NFTS = [
  { name: 'Lunar Snake', id: 154204, price: 3.57 },
  { name: 'Mood Pack', id: 96038, price: 4.83 },
  { name: 'Easter Egg', id: 82565, price: 5.14 },
  { name: 'Vice Cream', id: 39436, price: 7.62 },
  { name: 'Lush Bouquet', id: 103223, price: 8.29 },
  { name: 'Surge Board', id: 11063, price: 10.91 },
  { name: 'Pretty Posy', id: 15210, price: 11.36 },
  { name: 'Timeless Book', id: 53496, price: 13.74 },
  { name: 'Fine Pen', id: 19779, price: 14.08 },
  { name: 'Mad Pumpkin', id: 393, price: 16.45 },
  { name: 'Ionic Dryer', id: 18304, price: 17.27 },
  { name: 'Sky Stilettos', id: 40680, price: 19.63 },
  { name: 'Cupid Charm', id: 7774, price: 21.88 },
  { name: 'Snoop Cigar', id: 67501, price: 23.19 },
  { name: "Khabib's Papakha", id: 25795, price: 25.52 },
  { name: 'Bling Binky', id: 5255, price: 27.06 },
  { name: 'Electric Skull', id: 2358, price: 29.41 },
  { name: 'Eternal Rose', id: 8768, price: 31.77 },
  { name: 'Signet Ring', id: 8224, price: 35.33 },
  { name: 'Eternal Rose', id: 8768, price: 41.95 },
  { name: 'Toy Bear', id: 17136, price: 45.24 },
  { name: 'Candy Cane', id: 210154, price: 52.68 },
  { name: 'Neko Helmet', id: 1075, price: 64.12 },
  { name: 'Bonded Ring', id: 5842, price: 77.49 },
  { name: 'Swiss Watch', id: 21384, price: 85.86 },
  { name: 'Sharp Tongue', id: 4405, price: 93.03 },
  { name: 'Ion Gem', id: 3352, price: 102.71 },
  { name: 'Perfume Bottle', id: 733, price: 111.58 },
  { name: 'Fresh Socks', id: 36863, price: 139.92 },
  { name: 'Artisan Brick', id: 6086, price: 146.17 },
  { name: 'Loot Bag', id: 2216, price: 160.64 },
  { name: 'Nail Bracelet', id: 1610, price: 190.38 },
  { name: 'Astral Shard', id: 1510, price: 228.85 },
  { name: 'Mighty Arm', id: 1222, price: 253.26 },
  { name: 'Scared Cat', id: 11352, price: 312.73 },
  { name: 'Heroic Helmet', id: 1211, price: 351.09 },
  { name: 'Precious Peach', id: 1757, price: 404.54 },
  { name: "Durov's Cap", id: 975, price: 532.31 },
  { name: "Durov's Glasses", id: 1525, price: 758.96 },
  { name: 'Heart Locket', id: 1647, price: 1065.42 }
];

let currentLayout = null;
let fieldPainted = false;
let greenPercent = 30;
let spinGreen = 30;
let currentBet = 0;
let pendingResult = false;
let depositNfts = [];
let currentReward = null;

let balance = (() => {
  const stored = localStorage.getItem(STORAGE_KEY);
  const parsed = stored !== null ? parseFloat(stored) : NaN;
  return Number.isFinite(parsed) ? parsed : INITIAL_BALANCE;
})();

let inventory = (() => {
  const stored = localStorage.getItem(INVENTORY_KEY);
  if (stored) {
    try {
      const parsed = JSON.parse(stored);
      if (Array.isArray(parsed)) return parsed;
    } catch (e) {}
  }
  return [];
})();

let x = 0, y = 0, vx = 0, vy = 0, dirX = 0, dirY = 0, speed = 0;
let flying = false, accelerating = false;

function saveBalance() {
  localStorage.setItem(STORAGE_KEY, String(balance));
}

function saveInventory() {
  localStorage.setItem(INVENTORY_KEY, JSON.stringify(inventory));
}

function nftUrl(nft) {
  const cleanName = nft.name.toLowerCase().replace(/[^a-z]/g, '');
  return `https://nft.fragment.com/gift/${cleanName}-${nft.id}.small.jpg`;
}

function calcCoefficients(p) {
  const R = 0.5 * (1 - p);
  const W = 1 + ((1 - p) * (1 - R) - MARGIN) / p;
  return { W, R };
}

function buildLayout(greenPct) {
  const dirs = ['tb', 'bt', 'lr', 'rl'];
  const dir = dirs[Math.floor(Math.random() * 4)];
  const canRGR = (100 - greenPct) >= 20;
  const canGRG = greenPct >= 20;
  let pattern;
  if (canRGR && canGRG) pattern = Math.random() < 0.5 ? 'RGR' : 'GRG';
  else if (canGRG) pattern = 'GRG';
  else pattern = 'RGR';

  let sections;
  if (pattern === 'RGR') {
    const redTotal = 100 - greenPct;
    const r1 = 10 + Math.random() * (redTotal - 20);
    sections = [
      { percent: r1, type: 'red' },
      { percent: greenPct, type: 'green' },
      { percent: redTotal - r1, type: 'red' }
    ];
  } else {
    const g1 = 10 + Math.random() * (greenPct - 20);
    sections = [
      { percent: g1, type: 'green' },
      { percent: 100 - greenPct, type: 'red' },
      { percent: greenPct - g1, type: 'green' }
    ];
  }
  return { dir, sections };
}

function updateSections() {
  greenPercent = Number(slider.value);
  chanceValue.textContent = greenPercent + '%';
  updateInfo();
}

function getDepositTotal() {
  const bet = Number(betInput.value) || 0;
  const nftTotal = depositNfts.reduce((s, n) => s + n.price, 0);
  return bet + nftTotal;
}

function generateReward(p, totalDeposit) {
  const { W } = calcCoefficients(p);
  const winAmount = totalDeposit * W;

  const eligibleNfts = ALL_NFTS.filter(n => {
    if (n.price > winAmount) return false;
    const inInv = inventory.some(inv => inv.id === n.id);
    const inDeposit = depositNfts.some(dep => dep.id === n.id);
    return !inInv && !inDeposit;
  });
  
  if (eligibleNfts.length > 0) {
    const nft = eligibleNfts[eligibleNfts.length - 1];
    return {
      isWin: true,
      nft: { ...nft },
      gram: winAmount - nft.price
    };
  }
  
  return {
    isWin: true,
    nft: null,
    gram: winAmount
  };
}

function updateInfo() {
  const bet = Number(betInput.value) || 0;
  const nftTotal = depositNfts.reduce((s, n) => s + n.price, 0);
  const total = bet + nftTotal;
  
  if (total > 0) {
    const reward = generateReward(greenPercent / 100, total);
    currentReward = reward;

    winContainer.innerHTML = '';
    if (reward.nft) {
      const img = document.createElement('img');
      img.src = nftUrl(reward.nft);
      img.className = 'cube cube-nft';
      img.title = `${reward.nft.name} #${reward.nft.id}`;
      img.style.margin = '2px';
      winContainer.appendChild(img);

      const gramCube = document.createElement('div');
      gramCube.className = 'cube cube-gram';
      gramCube.textContent = reward.gram.toFixed(2);
      winContainer.appendChild(gramCube);
    } else {
      const gramCube = document.createElement('div');
      gramCube.className = 'cube cube-gram';
      gramCube.textContent = reward.gram.toFixed(2);
      winContainer.appendChild(gramCube);
    }

    const { R } = calcCoefficients(greenPercent / 100);
    returnAmountEl.textContent = (total * R).toFixed(2);
  } else {
    winContainer.innerHTML = '<div class="cube cube-gram">0.00</div>';
    returnAmountEl.textContent = '0.00';
  }
  
  renderDepositNfts();
}

function renderDepositNfts() {
  depositContainer.innerHTML = '';

  depositNfts.forEach((nft, idx) => {
    const img = document.createElement('img');
    img.src = nftUrl(nft);
    img.className = 'cube cube-nft';
    img.title = `${nft.name} #${nft.id} — ${nft.price} GRAM (Нажмите чтобы вернуть)`;
    img.addEventListener('click', () => {
      if (flying || pendingResult) return;
      inventory.push({ ...nft });
      depositNfts.splice(idx, 1);
      saveInventory();
      updateInfo();
      updateControls();
    });
    depositContainer.appendChild(img);
  });

  const bet = Number(betInput.value) || 0;
  const gramCube = document.createElement('div');
  gramCube.className = 'cube cube-gram';
  gramCube.textContent = bet.toFixed(2);
  depositContainer.appendChild(gramCube);
}

function updateControls() {
  const busy = flying || pendingResult;
  const bet = Number(betInput.value) || 0;
  const total = getDepositTotal();
  spinBtn.disabled = busy || total <= 0 || bet > balance;
  betInput.disabled = busy;
  slider.disabled = busy;
  fastModeEl.disabled = busy;
  presetBtns.forEach(btn => btn.disabled = busy);
  betMinusBtn.disabled = busy;
  betPlusBtn.disabled = busy;
  betMaxBtn.disabled = busy || balance <= 0;
  addNftBtn.disabled = busy;
  balanceEl.textContent = balance.toFixed(2);
}

function spawnBall() {
  x = BALL_RADIUS + Math.random() * (FIELD_SIZE - BALL_RADIUS * 2);
  y = BALL_RADIUS + Math.random() * (FIELD_SIZE - BALL_RADIUS * 2);
  vx = 0; vy = 0; speed = 0; flying = false; accelerating = false;
}

function launch() {
  const angle = Math.random() * Math.PI * 2;
  dirX = Math.cos(angle);
  dirY = Math.sin(angle);
  speed = 0; vx = 0; vy = 0;
  flying = true; accelerating = true;
}

function update() {
  if (!flying) return;
  if (accelerating) {
    speed += ACCEL_RATE * MAX_SPEED;
    if (speed >= MAX_SPEED) { speed = MAX_SPEED; accelerating = false; }
  } else {
    speed *= FRICTION;
  }
  vx = dirX * speed;
  vy = dirY * speed;
  x += vx;
  y += vy;
  if (x - BALL_RADIUS <= 0) { x = BALL_RADIUS; dirX = Math.abs(dirX); }
  else if (x + BALL_RADIUS >= FIELD_SIZE) { x = FIELD_SIZE - BALL_RADIUS; dirX = -Math.abs(dirX); }
  if (y - BALL_RADIUS <= 0) { y = BALL_RADIUS; dirY = Math.abs(dirY); }
  else if (y + BALL_RADIUS >= FIELD_SIZE) { y = FIELD_SIZE - BALL_RADIUS; dirY = -Math.abs(dirY); }
  if (!accelerating && speed < MIN_SPEED) {
    speed = 0; vx = 0; vy = 0; flying = false;
  }
}

function drawField(layout) {
  const { sections, dir } = layout;
  const isVertical = dir === 'tb' || dir === 'bt';
  const reversed = dir === 'bt' || dir === 'rl';
  const innerSize = FIELD_SIZE - BALL_RADIUS * 2;
  const OVERLAP = 1;
  let offset = 0;
  for (const s of sections) {
    const size = innerSize * s.percent / 100;
    let rx, ry, rw, rh;
    if (isVertical) {
      const yy = reversed
        ? FIELD_SIZE - BALL_RADIUS - offset - size
        : BALL_RADIUS + offset;
      rx = 0; ry = yy - OVERLAP; rw = FIELD_SIZE; rh = size + OVERLAP * 2;
    } else {
      const xx = reversed
        ? FIELD_SIZE - BALL_RADIUS - offset - size
        : BALL_RADIUS + offset;
      rx = xx - OVERLAP; ry = 0; rw = size + OVERLAP * 2; rh = FIELD_SIZE;
    }
    ctx.fillStyle = COLORS[s.type];
    ctx.fillRect(rx, ry, rw, rh);
    offset += size;
  }

  const firstColor = COLORS[reversed ? sections[sections.length - 1].type : sections[0].type];
  const lastColor = COLORS[reversed ? sections[0].type : sections[sections.length - 1].type];

  if (isVertical) {
    ctx.fillStyle = firstColor;
    ctx.fillRect(0, 0, FIELD_SIZE, BALL_RADIUS + OVERLAP);
    ctx.fillStyle = lastColor;
    ctx.fillRect(0, FIELD_SIZE - BALL_RADIUS - OVERLAP, FIELD_SIZE, BALL_RADIUS + OVERLAP);
  } else {
    ctx.fillStyle = firstColor;
    ctx.fillRect(0, 0, BALL_RADIUS + OVERLAP, FIELD_SIZE);
    ctx.fillStyle = lastColor;
    ctx.fillRect(FIELD_SIZE - BALL_RADIUS - OVERLAP, 0, BALL_RADIUS + OVERLAP, FIELD_SIZE);
  }
}

function draw() {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, FIELD_SIZE, FIELD_SIZE);
  if (fieldPainted && currentLayout) {
    drawField(currentLayout);
  }
  ctx.beginPath();
  ctx.arc(x, y, BALL_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#000000';
  ctx.stroke();
}

function isInGreenZone() {
  const { sections, dir } = currentLayout;
  const innerSize = FIELD_SIZE - BALL_RADIUS * 2;
  let coord;
  if (dir === 'tb') coord = y - BALL_RADIUS;
  else if (dir === 'bt') coord = FIELD_SIZE - BALL_RADIUS - y;
  else if (dir === 'lr') coord = x - BALL_RADIUS;
  else coord = FIELD_SIZE - BALL_RADIUS - x;

  let offset = 0;
  for (const s of sections) {
    const size = innerSize * s.percent / 100;
    if (coord >= offset && coord < offset + size) {
      return s.type === 'green';
    }
    offset += size;
  }
  return false;
}

function checkResult() {
  const { W, R } = calcCoefficients(spinGreen / 100);
  const nftTotal = depositNfts.reduce((s, n) => s + n.price, 0);
  const totalDeposit = currentBet + nftTotal;
  const isWin = isInGreenZone();

  if (isWin) {
    const reward = currentReward;
    if (!reward) return;

    if (reward.nft) {
      inventory.push(reward.nft);
      saveInventory();
    }
    balance += reward.gram;
    
    if (reward.nft) {
      resultEl.textContent = `Выигрыш! ${reward.nft.name} + ${reward.gram.toFixed(2)} GRAM`;
    } else {
      resultEl.textContent = `Выигрыш! +${reward.gram.toFixed(2)} GRAM`;
    }
    resultEl.style.color = '#00b300';
  } else {
    const payout = totalDeposit * R;
    balance += payout;
    resultEl.textContent = `Возврат: +${payout.toFixed(2)} GRAM`;
    resultEl.style.color = '#e00000';
  }
  depositNfts = [];

  saveBalance();
  pendingResult = false;
  updateInfo();
  updateControls();

  const currentBetVal = Number(betInput.value) || 0;
  if (currentBetVal > balance) {
    setMaxBet();
  }
}

function spin() {
  if (flying || pendingResult) return;
  const bet = Number(betInput.value);
  const total = getDepositTotal();
  if (!bet || bet <= 0 || bet > balance) return;
  currentBet = bet;
  spinGreen = greenPercent;
  currentLayout = buildLayout(spinGreen);
  fieldPainted = true;
  balance -= currentBet;
  saveBalance();
  resultEl.textContent = '';
  pendingResult = true;
  spawnBall();
  launch();
  updateControls();
}

function resetGame() {
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(INVENTORY_KEY);
  location.reload();
}

function stepBet(delta) {
  if (flying || pendingResult) return;
  let v = Number(betInput.value) || 0;
  v = Math.round((v + delta) * 10) / 10;
  if (v < BET_STEP) v = BET_STEP;
  betInput.value = v.toFixed(1);
  updateInfo();
  updateControls();
}

function setMaxBet() {
  if (flying || pendingResult) return;
  const v = Math.floor(balance * 100) / 100;
  if (v <= 0) return;
  betInput.value = v.toFixed(2);
  updateInfo();
  updateControls();
}

function openInventory() {
  if (flying || pendingResult) return;
  renderInventory();
  inventoryOverlay.classList.add('open');
}

function closeInventory() {
  inventoryOverlay.classList.remove('open');
}

function renderInventory() {
  inventoryList.innerHTML = '';
  if (!inventory.length) {
    const empty = document.createElement('div');
    empty.className = 'inventory-empty';
    empty.textContent = 'Нет NFT в инвентаре';
    inventoryList.appendChild(empty);
    return;
  }
  inventory.forEach((nft, idx) => {
    const item = document.createElement('div');
    item.className = 'inventory-item';
    item.innerHTML = `
      <img src="${nftUrl(nft)}" alt="${nft.name} #${nft.id}">
      <code class="inv-price">${nft.price} GRAM</code>
    `;
    item.addEventListener('click', () => {
      if (depositNfts.length >= 5) return;
      depositNfts.push({ ...nft });
      inventory.splice(idx, 1);
      saveInventory();
      updateInfo();
      updateControls();
      renderInventory();
      if (!inventory.length) closeInventory();
    });
    inventoryList.appendChild(item);
  });
}

function loop() {
  const steps = fastModeEl.checked ? FAST_MULTIPLIER : 1;
  for (let i = 0; i < steps; i++) {
    update();
    if (pendingResult && !flying) {
      checkResult();
      break;
    }
  }
  draw();
  requestAnimationFrame(loop);
}

slider.addEventListener('input', updateSections);
betInput.addEventListener('input', () => { updateInfo(); updateControls(); });
spinBtn.addEventListener('click', spin);
resetBtn.addEventListener('click', resetGame);
betMinusBtn.addEventListener('click', () => stepBet(-BET_STEP));
betPlusBtn.addEventListener('click', () => stepBet(BET_STEP));
betMaxBtn.addEventListener('click', setMaxBet);
addNftBtn.addEventListener('click', openInventory);
inventoryClose.addEventListener('click', closeInventory);
inventoryOverlay.addEventListener('click', (e) => {
  if (e.target === inventoryOverlay) closeInventory();
});

presetBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    if (flying || pendingResult) return;
    slider.value = btn.dataset.chance;
    updateSections();
  });
});

updateSections();
spawnBall();
updateControls();
loop();
</script>
</body>
</html>
