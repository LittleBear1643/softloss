function nftUrl(nft) {
  const cleanName = nft.name.toLowerCase().replace(/[^a-z]/g, '');
  return `https://nft.fragment.com/gift/${cleanName}-${nft.id}.small.jpg`;
}

function calcCoefficients(p) {
  const R = 0.5 * (1 - p);
  const W = 1 + ((1 - p) * (1 - R) - MARGIN) / p;
  return { W, R };
}

function buildLayout(greenPct) {
  const dirs = ['tb', 'bt', 'lr', 'rl'];
  const dir = dirs[Math.floor(Math.random() * 4)];
  const canRGR = (100 - greenPct) >= 20;
  const canGRG = greenPct >= 20;
  let pattern;
  if (canRGR && canGRG) pattern = Math.random() < 0.5 ? 'RGR' : 'GRG';
  else if (canGRG) pattern = 'GRG';
  else pattern = 'RGR';

  let sections;
  if (pattern === 'RGR') {
    const redTotal = 100 - greenPct;
    const r1 = 10 + Math.random() * (redTotal - 20);
    sections = [
      { percent: r1, type: 'red' },
      { percent: greenPct, type: 'green' },
      { percent: redTotal - r1, type: 'red' }
    ];
  } else {
    const g1 = 10 + Math.random() * (greenPct - 20);
    sections = [
      { percent: g1, type: 'green' },
      { percent: 100 - greenPct, type: 'red' },
      { percent: greenPct - g1, type: 'green' }
    ];
  }
  return { dir, sections };
}

function updateSections() {
  greenPercent = Number(slider.value);
  chanceValue.textContent = greenPercent + '%';
  updateInfo();
}

function getDepositTotal() {
  const bet = Number(betInput.value) || 0;
  const nftTotal = depositNfts.reduce((s, n) => s + n.price, 0);
  return bet + nftTotal;
}

function getAvailableNfts(limitAmount) {
  return ALL_NFTS.filter(n => {
    if (n.price > limitAmount) return false;
    const inInv = inventory.some(inv => inv.id === n.id);
    const inDeposit = depositNfts.some(dep => dep.id === n.id);
    return !inInv && !inDeposit;
  });
}

function generateReward(p, totalDeposit) {
  const { W } = calcCoefficients(p);
  const winAmount = totalDeposit * W;

  const eligibleNfts = getAvailableNfts(winAmount);
  
  if (eligibleNfts.length > 0) {
    const nft = eligibleNfts[eligibleNfts.length - 1];
    return {
      isWin: true,
      nft: { ...nft },
      gram: winAmount - nft.price
    };
  }
  
  return {
    isWin: true,
    nft: null,
    gram: winAmount
  };
}

function createGramCube(amount, isDeposit = false) {
  if (amount <= 0) return null;
  const gramCube = document.createElement('div');
  gramCube.className = 'cube cube-gram';
  gramCube.innerHTML = `<img src="gram.png"><code>${amount.toFixed(2)}</code>`;
  
  if (isDeposit) {
    gramCube.style.cursor = 'pointer';
    gramCube.addEventListener('click', () => {
      if (flying || pendingResult) return;
      betInput.value = '0.00';
      updateInfo();
      updateControls();
    });
  }
  
  return gramCube;
}

function updateInfo() {
  const bet = Number(betInput.value) || 0;
  const nftTotal = depositNfts.reduce((s, n) => s + n.price, 0);
  const total = bet + nftTotal;
  
  if (total > 0) {
    const reward = generateReward(greenPercent / 100, total);
    currentReward = reward;

    winContainer.innerHTML = '';
    if (reward.nft) {
      const img = document.createElement('img');
      img.src = nftUrl(reward.nft);
      img.className = 'cube cube-nft';
      img.title = `${reward.nft.name} #${reward.nft.id}`;
      img.style.margin = '2px';
      winContainer.appendChild(img);
    }
    const winGram = createGramCube(reward.gram);
    if (winGram) winContainer.appendChild(winGram);

    const { R } = calcCoefficients(greenPercent / 100);
    const returnAmountVal = total * R;

    returnContainer.innerHTML = '';
    const eligibleReturn = getAvailableNfts(returnAmountVal);

    if (eligibleReturn.length > 0) {
      const rnft = eligibleReturn[eligibleReturn.length - 1];
      const img = document.createElement('img');
      img.src = nftUrl(rnft);
      img.className = 'cube cube-nft';
      img.title = `${rnft.name} #${rnft.id}`;
      img.style.margin = '2px';
      returnContainer.appendChild(img);
      
      const retGram = createGramCube(returnAmountVal - rnft.price);
      if (retGram) returnContainer.appendChild(retGram);
    } else {
      const retGram = createGramCube(returnAmountVal);
      if (retGram) returnContainer.appendChild(retGram);
    }
  } else {
    winContainer.innerHTML = '';
    returnContainer.innerHTML = '';
  }
  
  renderDepositNfts();
}

function renderDepositNfts() {
  depositContainer.innerHTML = '';

  depositNfts.forEach((nft, idx) => {
    const img = document.createElement('img');
    img.src = nftUrl(nft);
    img.className = 'cube cube-nft';
    img.title = `${nft.name} #${nft.id} — ${nft.price} GRAM`;
    img.addEventListener('click', () => {
      if (flying || pendingResult) return;
      inventory.push({ ...nft });
      depositNfts.splice(idx, 1);
      saveInventory();
      updateInfo();
      updateControls();
    });
    depositContainer.appendChild(img);
  });

  const bet = Number(betInput.value) || 0;
  const gramCube = createGramCube(bet, true);
  if (gramCube) depositContainer.appendChild(gramCube);

  let currentCubes = depositNfts.length;
  if (bet > 0) currentCubes++;

  if (currentCubes < 6) {
    const addBtn = document.createElement('div');
    addBtn.className = 'cube cube-add-nft';
    addBtn.innerHTML = '+';
    addBtn.addEventListener('click', openInventory);
    
    if (flying || pendingResult) {
      addBtn.style.opacity = '0.5';
      addBtn.style.pointerEvents = 'none';
    }
    
    depositContainer.appendChild(addBtn);
  }
}

function updateControls() {
  const busy = flying || pendingResult;
  const bet = Number(betInput.value) || 0;
  const total = getDepositTotal();
  
  const minBet = depositNfts.length > 0 ? 0 : 0.5;
  spinBtn.disabled = busy || total <= 0 || bet > balance || bet < minBet;
  
  betInput.disabled = busy;
  slider.disabled = busy;
  fastModeEl.disabled = busy;
  presetBtns.forEach(btn => btn.disabled = busy);
  betMinusBtn.disabled = busy;
  betPlusBtn.disabled = busy;
  betMaxBtn.disabled = busy || balance <= 0;
  
  const addNftBtnEl = depositContainer.querySelector('.cube-add-nft');
  if (addNftBtnEl) {
    if (busy) {
      addNftBtnEl.style.opacity = '0.5';
      addNftBtnEl.style.pointerEvents = 'none';
    } else {
      addNftBtnEl.style.opacity = '1';
      addNftBtnEl.style.pointerEvents = 'auto';
    }
  }

  balanceEl.textContent = balance.toFixed(2);
}

function spawnBall() {
  x = BALL_RADIUS + Math.random() * (FIELD_SIZE - BALL_RADIUS * 2);
  y = BALL_RADIUS + Math.random() * (FIELD_SIZE - BALL_RADIUS * 2);
  vx = 0; vy = 0; speed = 0; flying = false; accelerating = false;
  trailPoints = [];
  lastTrailX = null;
  lastTrailY = null;
}

function launch() {
  const angle = Math.random() * Math.PI * 2;
  dirX = Math.cos(angle);
  dirY = Math.sin(angle);
  speed = 0; vx = 0; vy = 0;
  flying = true; accelerating = true;
  trailPoints = [];
  lastTrailX = x;
  lastTrailY = y;
}

function updateTrail(now) {
  trailPoints = trailPoints.filter(p => now - p.time < TRAIL_LIFETIME);
  if (!flying) return;
  if (lastTrailX === null) {
    lastTrailX = x;
    lastTrailY = y;
    return;
  }
  const dx = x - lastTrailX;
  const dy = y - lastTrailY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist >= TRAIL_INTERVAL) {
    trailPoints.push({ x, y, time: now });
    lastTrailX = x;
    lastTrailY = y;
  }
}

function update() {
  if (!flying) return;
  if (accelerating) {
    speed += ACCEL_RATE * MAX_SPEED;
    if (speed >= MAX_SPEED) { speed = MAX_SPEED; accelerating = false; }
  } else {
    speed *= FRICTION;
  }
  vx = dirX * speed;
  vy = dirY * speed;
  x += vx;
  y += vy;
  if (x - BALL_RADIUS <= 0) { x = BALL_RADIUS; dirX = Math.abs(dirX); }
  else if (x + BALL_RADIUS >= FIELD_SIZE) { x = FIELD_SIZE - BALL_RADIUS; dirX = -Math.abs(dirX); }
  if (y - BALL_RADIUS <= 0) { y = BALL_RADIUS; dirY = Math.abs(dirY); }
  else if (y + BALL_RADIUS >= FIELD_SIZE) { y = FIELD_SIZE - BALL_RADIUS; dirY = -Math.abs(dirY); }
  if (!accelerating && speed < MIN_SPEED) {
    speed = 0; vx = 0; vy = 0; flying = false;
  }
}

function drawField(layout) {
  const { sections, dir } = layout;
  const isVertical = dir === 'tb' || dir === 'bt';
  const reversed = dir === 'bt' || dir === 'rl';
  const innerSize = FIELD_SIZE - BALL_RADIUS * 2;
  const OVERLAP = 1;
  let offset = 0;
  for (const s of sections) {
    const size = innerSize * s.percent / 100;
    let rx, ry, rw, rh;
    if (isVertical) {
      const yy = reversed
        ? FIELD_SIZE - BALL_RADIUS - offset - size
        : BALL_RADIUS + offset;
      rx = 0; ry = yy - OVERLAP; rw = FIELD_SIZE; rh = size + OVERLAP * 2;
    } else {
      const xx = reversed
        ? FIELD_SIZE - BALL_RADIUS - offset - size
        : BALL_RADIUS + offset;
      rx = xx - OVERLAP; ry = 0; rw = size + OVERLAP * 2; rh = FIELD_SIZE;
    }
    ctx.fillStyle = COLORS[s.type];
    ctx.fillRect(rx, ry, rw, rh);
    offset += size;
  }

  const firstColor = COLORS[reversed ? sections[sections.length - 1].type : sections[0].type];
  const lastColor = COLORS[reversed ? sections[0].type : sections[sections.length - 1].type];

  if (isVertical) {
    ctx.fillStyle = firstColor;
    ctx.fillRect(0, 0, FIELD_SIZE, BALL_RADIUS + OVERLAP);
    ctx.fillStyle = lastColor;
    ctx.fillRect(0, FIELD_SIZE - BALL_RADIUS - OVERLAP, FIELD_SIZE, BALL_RADIUS + OVERLAP);
  } else {
    ctx.fillStyle = firstColor;
    ctx.fillRect(0, 0, BALL_RADIUS + OVERLAP, FIELD_SIZE);
    ctx.fillStyle = lastColor;
    ctx.fillRect(FIELD_SIZE - BALL_RADIUS - OVERLAP, 0, BALL_RADIUS + OVERLAP, FIELD_SIZE);
  }
}

function drawTrail(now) {
  for (const p of trailPoints) {
    const age = now - p.time;
    const alpha = 0.35 * (1 - age / TRAIL_LIFETIME);
    if (alpha <= 0) continue;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }
}

function draw(now) {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, FIELD_SIZE, FIELD_SIZE);
  if (fieldPainted && currentLayout) {
    drawField(currentLayout);
  }
  drawTrail(now);
  ctx.beginPath();
  ctx.arc(x, y, BALL_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#000000';
  ctx.stroke();
}

function isInGreenZone() {
  const { sections, dir } = currentLayout;
  const innerSize = FIELD_SIZE - BALL_RADIUS * 2;
  let coord;
  if (dir === 'tb') coord = y - BALL_RADIUS;
  else if (dir === 'bt') coord = FIELD_SIZE - BALL_RADIUS - y;
  else if (dir === 'lr') coord = x - BALL_RADIUS;
  else coord = FIELD_SIZE - BALL_RADIUS - x;

  let offset = 0;
  for (const s of sections) {
    const size = innerSize * s.percent / 100;
    if (coord >= offset && coord < offset + size) {
      return s.type === 'green';
    }
    offset += size;
  }
  return false;
}

function checkResult() {
  const { W, R } = calcCoefficients(spinGreen / 100);
  const nftTotal = depositNfts.reduce((s, n) => s + n.price, 0);
  const totalDeposit = currentBet + nftTotal;
  const isWin = isInGreenZone();

  let winNft = null;
  let winGram = 0;

  if (isWin) {
    const reward = currentReward;
    if (!reward) return;

    winNft = reward.nft;
    winGram = reward.gram;

    if (winNft) {
      inventory.push(winNft);
      saveInventory();
    }
    balance += winGram;
    
  } else {
    const returnAmountVal = totalDeposit * R;
    const eligibleReturn = getAvailableNfts(returnAmountVal);
    
    if (eligibleReturn.length > 0) {
      const rnft = eligibleReturn[eligibleReturn.length - 1];
      winNft = rnft;
      winGram = returnAmountVal - rnft.price;
      
      inventory.push({ ...rnft });
      saveInventory();
      balance += winGram;
    } else {
      winGram = returnAmountVal;
      balance += returnAmountVal;
    }
  }
  
  const betNfts = [...depositNfts];
  const betAmount = currentBet;
  
  depositNfts = [];

  saveBalance();
  pendingResult = false;
  gameOverVisible = true;
  
  updateInfo();
  updateControls();

  const currentBetVal = Number(betInput.value) || 0;
  if (currentBetVal > balance) {
    setMaxBet();
  }

  showGameOver(isWin, winNft, winGram, betNfts, betAmount);
}

function showGameOver(isWin, winNft, winGram, betNfts, betAmount) {
  gameOverTitle.textContent = isWin ? 'Идеально!' : 'Почти!';
  gameOverTitle.style.color = isWin ? '#00b300' : '#ef233c';
  
  gameOverReward.innerHTML = '';
  if (winNft) {
    const img = document.createElement('img');
    img.src = nftUrl(winNft);
    img.className = 'cube cube-nft';
    img.style.margin = '0';
    gameOverReward.appendChild(img);
  }
  if (winGram > 0) {
    const gramCube = document.createElement('div');
    gramCube.className = 'cube cube-gram';
    gramCube.innerHTML = `<img src="gram.png"><code>${winGram.toFixed(2)}</code>`;
    gramCube.style.margin = '0';
    gameOverReward.appendChild(gramCube);
  }
  
  gameOverBet.innerHTML = '';
  
  betNfts.forEach(nft => {
    const img = document.createElement('img');
    img.src = nftUrl(nft);
    img.className = 'cube cube-nft';
    img.style.margin = '0';
    gameOverBet.appendChild(img);
  });

  if (betAmount > 0) {
    const gramCube = document.createElement('div');
    gramCube.className = 'cube cube-gram';
    gramCube.innerHTML = `<img src="gram.png"><code>${betAmount.toFixed(2)}</code>`;
    gramCube.style.margin = '0';
    gameOverBet.appendChild(gramCube);
  }

  gameOverOverlay.classList.add('show');

  if (isWin) {
    confetti({
      particleCount: 120,
      spread: 80,
      origin: { y: 0.6 }
    });
  }
}

function spin() {
  if (flying || pendingResult) return;
  const bet = Number(betInput.value);
  const total = getDepositTotal();
  const minBet = depositNfts.length > 0 ? 0 : 0.5;
  if (!bet && bet !== 0 || bet > balance || bet < minBet) return;
  if (total <= 0) return;
  
  gameOverVisible = false;
  gameOverOverlay.classList.remove('show');
  
  currentBet = bet;
  spinGreen = greenPercent;
  currentLayout = buildLayout(spinGreen);
  fieldPainted = true;
  balance -= currentBet;
  saveBalance();
  resultEl.textContent = '';
  pendingResult = true;
  
  spawnBall();
  launch();
  updateControls();
}

function resetGame() {
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(INVENTORY_KEY);
  location.reload();
}

function stepBet(delta) {
  if (flying || pendingResult) return;
  let v = Number(betInput.value) || 0;
  v = Math.round((v + delta) * 10) / 10;
  const minBet = depositNfts.length > 0 ? 0 : BET_STEP;
  if (v < minBet) v = minBet;
  betInput.value = v.toFixed(1);
  updateInfo();
  updateControls();
}

function setMaxBet() {
  if (flying || pendingResult) return;
  const v = Math.floor(balance * 100) / 100;
  if (v <= 0) return;
  betInput.value = v.toFixed(2);
  updateInfo();
  updateControls();
}

function openInventory() {
  if (flying || pendingResult) return;
  renderInventory();
  inventoryOverlay.classList.add('open');
}

function closeInventory() {
  inventoryOverlay.classList.remove('open');
}

function renderInventory() {
  inventoryList.innerHTML = '';
  if (!inventory.length) {
    const empty = document.createElement('div');
    empty.className = 'inventory-empty';
    empty.textContent = 'Нет NFT в инвентаре';
    inventoryList.appendChild(empty);
    return;
  }
    inventory.sort((a, b) => b.price - a.price);
  inventory.forEach((nft, idx) => {
    const item = document.createElement('div');
    item.className = 'inventory-item';
    item.innerHTML = `
      <img src="${nftUrl(nft)}" alt="${nft.name} #${nft.id}">
      <code class="inv-price">${nft.price} <img src="gram.png"></code>
    `;
    item.addEventListener('click', () => {
      if (depositNfts.length >= 5) return;
      depositNfts.push({ ...nft });
      inventory.splice(idx, 1);
      saveInventory();
      updateInfo();
      updateControls();
      renderInventory();
      if (!inventory.length) closeInventory();
    });
    inventoryList.appendChild(item);
  });
}

function loop(timestamp) {
  const steps = fastModeEl.checked ? FAST_MULTIPLIER : 1;
  for (let i = 0; i < steps; i++) {
    update();
    if (pendingResult && !flying) {
      checkResult();
      break;
    }
  }
  updateTrail(timestamp);
  draw(timestamp);
  requestAnimationFrame(loop);
}

let isDown = false;
let startX;
let scrollLeft;

gameOverBet.addEventListener('mousedown', (e) => {
  isDown = true;
  gameOverBet.style.cursor = 'grabbing';
  startX = e.pageX - gameOverBet.offsetLeft;
  scrollLeft = gameOverBet.scrollLeft;
  e.preventDefault();
});
gameOverBet.addEventListener('mouseleave', () => {
  isDown = false;
  gameOverBet.style.cursor = 'grab';
});
gameOverBet.addEventListener('mouseup', () => {
  isDown = false;
  gameOverBet.style.cursor = 'grab';
});
gameOverBet.addEventListener('mousemove', (e) => {
  if (!isDown) return;
  e.preventDefault();
  const x = e.pageX - gameOverBet.offsetLeft;
  const walk = (x - startX) * 1.5;
  gameOverBet.scrollLeft = scrollLeft - walk;
});

slider.addEventListener('input', updateSections);
betInput.addEventListener('input', () => { updateInfo(); updateControls(); });
spinBtn.addEventListener('click', spin);
resetBtn.addEventListener('click', resetGame);
betMinusBtn.addEventListener('click', () => stepBet(-BET_STEP));
betPlusBtn.addEventListener('click', () => stepBet(BET_STEP));
betMaxBtn.addEventListener('click', setMaxBet);
inventoryClose.addEventListener('click', closeInventory);
inventoryOverlay.addEventListener('click', (e) => {
  if (e.target === inventoryOverlay) closeInventory();
});

presetBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    if (flying || pendingResult) return;
    slider.value = btn.dataset.chance;
    updateSections();
  });
});

initTopbarUser();
currentLayout = buildLayout(30);
fieldPainted = true;
updateSections();
spawnBall();
updateControls();
requestAnimationFrame(loop);
</script>
